<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>rune-pele gallery</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}#status{font:16px system-ui;padding:24px;max-width:40em}</style>
<div id="status">Loading the rune-pele gallery…</div>
<script type="module">
import init from './app.js';
try {
    if (!navigator.gpu) throw new Error('The gallery draws with WebGPU, which this browser does not offer here. Current Chrome, Edge and Safari do, over HTTPS or on localhost.');
    await init();
    document.querySelector('#status').remove();
} catch (error) {
    document.querySelector('#status').textContent = String(error);
    console.error(error);
}
</script>
</html>
