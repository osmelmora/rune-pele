[package]
name = "pele-core"
description = "Rune-free Mermaid parse, layout and scene core, ported from Pele"
edition.workspace = true
license.workspace = true
version.workspace = true
# The oldest Rust that builds this crate, measured with `mise run msrv`: 1.94 cannot read its
# `if let` guards.
rust-version = "1.95"

[dependencies]
indexmap = "2"
libm = "0.2.16"
ryu-js = "1"
url = "2"

[dev-dependencies]
pele-oracle = { path = "../pele-oracle" }
serde_json = "1"

[lints]
workspace = true
