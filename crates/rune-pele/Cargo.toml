[package]
name = "rune-pele"
description = "Draw rune-pele's Mermaid Scene natively in Rune apps"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true
# The oldest Rust that builds this crate with its default features, measured with
# `mise run msrv`: 1.94 cannot read the `if let` guards of Rune and of pele-core.
rust-version = "1.95"

[features]
default = ["fallback"]
# Rune's rune-mermaid draws a source the native view does not. Off, such a source is an error,
# and an app builds without rune-mermaid.
fallback = ["dep:rune-mermaid"]
# Rune's embedded Inter, which `FontCatalog::rune()` measures with, for an app that takes Rune
# as `rune_pele::rune`, with no `rune` dependency of its own to turn it on.
embedded-fonts = ["rune/embedded-fonts"]

[dependencies]
# Rune's default features (Metal backend, D-Bus, Ogg audio, embedded Inter, SVG images) are the
# app's choice. rune-mermaid depends on Rune the same way.
rune = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21", default-features = false }
# Draws, with `fallback`, a source the native view does not. Same rev as `rune`.
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21", optional = true }
pele-core = { path = "../pele-core" }

[dev-dependencies]
# Headless tests measure and draw text in Inter, which `embedded-fonts` embeds. Without it Rune
# draws in a system font, whose widths differ from the ones the tests expect.
# `tooling` keeps the example's `--snap` in release builds too; debug builds always have it.
rune = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21", default-features = false, features = ["embedded-fonts", "tooling"] }
# Rasterises Pele's own SVG beside the native drawing. The version Rune's `svg` feature uses.
resvg = { version = "0.45", default-features = false, features = ["text"] }
pele-oracle = { path = "../pele-oracle" }
serde_json = "1"

[lints]
workspace = true
