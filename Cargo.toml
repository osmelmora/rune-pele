[workspace]
resolver = "3"
members = ["crates/pele-core", "crates/pele-oracle", "crates/pele-cli", "crates/rune-pele"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.1"
rust-version = "1.100"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# Test builds. The tests spend their time in the port's own layout code and in resvg and wgpu, and
# unoptimised they ran 771 s; with these settings, 227 s (measured, M3 Pro). Debug assertions and
# overflow checks stay on, and the parity tests still match Pele byte for byte. An app that
# depends on these crates does not read this: Cargo takes profiles from the app's workspace only.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Rune patches these four crates in its own workspace, and a dependency's `[patch]` does not reach
# the workspace that depends on it (vendor/rune/crates/rune/README.md, "Depending on Rune"). Keep
# the rev equal to rune-pele's `rune` rev.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
