[workspace]
resolver = "3"
members = ["crates/pele-core", "crates/pele-oracle", "crates/pele-cli", "crates/rune-pele"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.3.0"
rust-version = "1.100"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
# No crate has an unsafe block, and none needs one: the port is arithmetic and Rune's safe API.
# `forbid`, so no `#[allow]` further in can turn it back on.
unsafe_code = "forbid"
# An app logs and asserts on what it holds, so every public type implements Debug.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# A builder method that returns Self does nothing unless its result is kept, so an app that drops
# it gets a warning. Only `return_self_not_must_use`: `must_use_candidate` would mark every getter.
return_self_not_must_use = "warn"

# Test builds. The tests spend their time in the port's own layout code and in resvg and wgpu, and
# unoptimised they ran 771 s; with these settings, 227 s (measured, M3 Pro). Debug assertions and
# overflow checks stay on, and the parity tests still match Pele byte for byte. An app that
# depends on these crates does not read this: Cargo takes profiles from the app's workspace only.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Rune patches these eight crates in its own workspace, and a dependency's `[patch]` does not reach
# the workspace that depends on it (vendor/rune/crates/rune/README.md, "Depending on Rune"). Keep
# the rev equal to rune-pele's `rune` rev.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "761555829efe531efb83ff2a3ba60705262d69be" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "761555829efe531efb83ff2a3ba60705262d69be" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "761555829efe531efb83ff2a3ba60705262d69be" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "761555829efe531efb83ff2a3ba60705262d69be" }
naga = { git = "https://github.com/anomalyco/rune", rev = "761555829efe531efb83ff2a3ba60705262d69be" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "761555829efe531efb83ff2a3ba60705262d69be" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "761555829efe531efb83ff2a3ba60705262d69be" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "761555829efe531efb83ff2a3ba60705262d69be" }
