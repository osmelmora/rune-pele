[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy" }
node = "26.13.1"
"cargo:kani-verifier" = "0.68.0"

[env]
TZ = "UTC"

[tasks.setup]
description = "Fetch Pele at the pinned commit and build the Node oracle"
run = "scripts/setup.sh"

[tasks.check]
description = "fmt, clippy, unit tests and the differential tests against Pele"
run = "scripts/check.sh"

[tasks.rune-corpus]
description = "Draw every corpus source of the graph types natively in Rune, beside Pele's SVG through resvg (release)"
run = "cargo test -q --release -p rune-pele --test graph_view -- --nocapture --test-threads=1"

[tasks.prove]
description = "Run the Kani proofs for the JS numerics"
run = "cargo kani -p pele-core -j --output-format terse"
