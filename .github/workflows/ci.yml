# CI runs in two jobs, each one command a developer runs the same way: the checks that need no
# build, `mise run lint` and `mise run deny`, and the tests on Linux arm64, `mise run ci`. Locally
# the tests run on macOS. It runs on every pull request and every push to main, and when started
# by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # A runner has 14 GB of disk. With debug info, `cargo test` left 32 GB in target/, 18 GB with
  # line tables only, and 4.8 GB with none (measured on Linux). A panic still names its file
  # and line, and debug assertions stay on, so the same tests run.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # `mise run` installs every tool mise.toml pins that is missing, Kani's among them. The job
  # installs the ones it uses.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

# A newer run cancels an older one of the same pull request, or of main for the same event.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # The licence copies, rustfmt, the workflows, the shell scripts and Cargo.lock's crates, none of
    # which builds anything, so they report long before the tests do. cargo-deny reads the lock
    # through cargo metadata, which fetches the crates: 15 s with nothing cached, measured on macOS.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          install_args: rust actionlint shellcheck cargo-deny
      - run: mise run lint
      - run: mise run deny

  linux:
    name: Linux arm64
    # arm64 Linux, where the whole job was measured passing, drawing tests included; Pele's maths
    # there matches the arm64 Node every measurement in this repository was made with.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Rune links xkbcommon and Wayland. lavapipe is a Vulkan GPU in software, for the tests that
      # draw, and Liberation Sans has Arial's metrics, which they draw Pele's SVG in.
      - run: >-
          sudo apt-get update -q &&
          sudo apt-get install -yq --no-install-recommends
          libxkbcommon-dev libwayland-dev mesa-vulkan-drivers fonts-liberation
      - uses: jdx/mise-action@v5.2.10
        with:
          install_args: rust node hk actionlint shellcheck github:wasm-bindgen/wasm-bindgen
      - uses: actions/cache@v6.1.0
        with:
          path: vendor/pele
          key: pele-${{ hashFiles('scripts/pele-pin.txt') }}
      # Cargo's registry, Rune's git checkout and the dependencies built in target/. Saved from
      # main only, so pull requests restore main's and add no caches of their own.
      # Its key leaves out the profiles in Cargo.toml, and it does not save over a key it restored
      # whole, so a change of opt-level kept restoring dependencies built at the old one (measured:
      # 15 minutes of building on each run). Keying on Cargo.toml saves a new cache on such a change.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ci.sh
      # rust-cache keeps each dependency's folder in target/*/build, and takes rune-pele's for
      # Rune's, a name followed by a part it drops. It holds this workspace's test binaries, so it
      # is removed before the cache is saved.
      - run: rm -rf target/*/build/rune-pele target/*/*/build/rune-pele
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: parity
          path: out/ci/parity.txt
          retention-days: 14
