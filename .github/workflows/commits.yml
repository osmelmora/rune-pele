# Every commit of a pull request follows Conventional Commits, which release-plz reads for the
# version bump and the changelog. hk.pkl checks the same locally, on commit.
name: Commit messages

on:
  pull_request:

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          install_args: hk
      - name: Check each commit's message
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            hk util check-conventional-commit "$RUNNER_TEMP/message" || { echo "in $sha"; failed=1; }
          done
          exit $failed
