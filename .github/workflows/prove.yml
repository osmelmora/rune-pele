# The Kani proofs of pele-core's JS numerics, `mise run prove`, weekly and when started by hand.
# They take minutes, and Kani downloads its own toolchain on first use, so they do not run on
# every push.
name: Prove

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # `mise run` installs every tool mise.toml pins that is missing; the job installs the two it uses.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

concurrency:
  group: prove
  cancel-in-progress: true

jobs:
  kani:
    name: Kani
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          install_args: rust cargo:kani-verifier
      - run: mise run prove
